<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RHS Labs – Sentinel, the intelligent back-office for betting operators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Light palette: warm white and deep green */
:root{
  --bg:#F7F6F3; --bg2:#EFEDE8; --ink:#16181B; --muted:#615F5A; --line:#DEDBD3;
  --accent:#0F766E; --accent-ink:#FFFFFF; --hdr:rgba(247,246,243,.9);
  --head:"Sora","Segoe UI",system-ui,sans-serif; --body:"DM Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Dark palette: navy-black and green. Default when the viewer is in dark mode */
@media (prefers-color-scheme:dark){
  :root:not([data-palette]){--bg:#0A1426;--bg2:#0F1D36;--ink:#EEF2F8;--muted:#9AA7BA;--line:#1D2C47;--accent:#34CDB8;--accent-ink:#06201C;--hdr:rgba(10,20,38,.88);color-scheme:dark}
}
:root[data-palette="dark"]{--bg:#0A1426;--bg2:#0F1D36;--ink:#EEF2F8;--muted:#9AA7BA;--line:#1D2C47;--accent:#34CDB8;--accent-ink:#06201C;--hdr:rgba(10,20,38,.88);color-scheme:dark}
:root[data-palette="light"]{--bg:#F7F6F3;--bg2:#EFEDE8;--ink:#16181B;--muted:#615F5A;--line:#DEDBD3;--accent:#0F766E;--accent-ink:#FFFFFF;--hdr:rgba(247,246,243,.9);color-scheme:light}

*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--body);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding-left:clamp(1.25rem,4vw,2rem);padding-right:clamp(1.25rem,4vw,2rem)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hdr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font:600 1.2rem/1 var(--head);letter-spacing:-.01em}
.brand span{font-weight:400;color:var(--muted)}
.right{display:flex;align-items:center;gap:1.4rem}
nav{display:flex;gap:1.5rem}
nav a{text-decoration:none;color:var(--muted);font-size:.94rem}
nav a:hover{color:var(--ink)}
.tools{display:flex;align-items:center;gap:.9rem}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:.3rem .55rem;font:500 .8rem/1 var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pal{display:flex;gap:.45rem}
.pal button{all:unset;box-sizing:border-box;cursor:pointer;width:20px;height:20px;border-radius:50%;border:1px solid var(--line)}
.pal button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.seg button:focus-visible,.pal button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:.85rem 1.35rem;font:500 1rem/1 var(--body);text-decoration:none;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);cursor:pointer;transition:filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:.6rem 1rem;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.arrow{color:var(--accent);text-decoration:none;font-weight:500}
.arrow:hover{text-decoration:underline;text-underline-offset:4px}
.arrow::after{content:" →"}

h1{font:600 clamp(2.3rem,4.6vw,3.7rem)/1.08 var(--head);letter-spacing:-.035em;margin:0 0 1.3rem;max-width:18ch}
h2{font:600 clamp(1.7rem,3vw,2.4rem)/1.15 var(--head);letter-spacing:-.025em;margin:0 0 .9rem;max-width:24ch}
h3{font:600 1.1rem/1.3 var(--head);margin:0 0 .5rem}
.sub{color:var(--muted);margin:0 0 2.5rem;max-width:40rem}
section{padding:clamp(3.5rem,8vw,6rem) 0}
.tag{display:inline-block;font:500 .75rem/1 var(--body);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:.3rem .6rem}
.tag.pilot{border-color:var(--accent);color:var(--accent)}

/* hero */
.hero{background:var(--bg2);border-bottom:1px solid var(--line);padding:clamp(2.5rem,6vw,4.5rem) 0}
.hero-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(1.5rem,5vw,4rem);align-items:center}
.lede{color:var(--muted);font-size:clamp(1.05rem,1.4vw,1.18rem);max-width:36rem;margin:0 0 1.75rem}
.ticks{list-style:none;margin:0 0 2rem;padding:0;display:grid;gap:.9rem;max-width:36rem}
.ticks li{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start}
.ck{display:grid;place-items:center;width:22px;height:22px;margin-top:.15rem;border:1.5px solid var(--accent);border-radius:50%;color:var(--accent)}
.hero .tag{margin-bottom:1.4rem}

/* form card */
.fcard{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:clamp(1.25rem,3vw,2rem)}
.fcard h3{font:600 1.3rem/1.25 var(--head);margin:0 0 1.1rem}
.stepbar{display:flex;align-items:center;gap:.8rem;font-size:.85rem;color:var(--muted);margin-bottom:1.1rem}
.stepbar i{flex:1;height:6px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.stepbar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,50%);background:var(--accent);border-radius:99px;transition:width .3s}
.fcard form{display:grid;gap:.9rem}
.pane{display:grid;gap:.9rem}
label{display:grid;gap:.35rem;font:500 .88rem/1.2 var(--body)}
input,select,textarea{font:400 1rem/1.4 var(--body);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:.72rem .85rem;width:100%}
textarea{min-height:5.5rem;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.btns{display:flex;gap:.6rem;align-items:center}
.fnote{color:var(--muted);font-size:.83rem;margin:0}
.err{font-size:.9rem;margin:0;min-height:1.1rem;font-weight:500}

/* solutions */
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.3rem 1.5rem;display:flex;flex-direction:column;gap:.5rem}
.card svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:.6rem}
.card p{margin:0 0 .6rem;color:var(--muted);font-size:.95rem;flex:1}
.card .tag{align-self:flex-start}
.note{color:var(--muted);font-size:.9rem;margin:1.5rem 0 0;max-width:46rem}
#solutions{background:var(--bg2);border-bottom:1px solid var(--line)}
#solutions .card{background:var(--bg)}

/* feature blocks */
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(1.5rem,5vw,4.5rem);align-items:center}
.feat.rev .ftext{order:2}
.ftext .tag{margin-bottom:1rem}
.ftext p{color:var(--muted);margin:0 0 1.25rem}
.bul{list-style:none;margin:0 0 1.5rem;padding:0;display:grid;gap:.7rem}
.bul li{display:grid;grid-template-columns:auto 1fr;gap:.7rem}
.bul .ck{width:20px;height:20px;margin-top:.2rem}

/* mock panels */
.mock{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:.86rem;line-height:1.45}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);font:600 .92rem/1 var(--head)}
.mtop em{font:400 .72rem/1 var(--body);color:var(--muted);font-style:normal}
.mbody{padding:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.3rem .65rem;font-size:.8rem}
.chip.hot{border-color:var(--accent);color:var(--accent);font-weight:600}
.sigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-bottom:.9rem}
.sig{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
.sig small{display:block;color:var(--muted);font-size:.7rem}
.sig b{font-weight:500;font-size:.8rem}
.sig.warn{border-color:var(--accent)}
.sig.warn b{color:var(--accent)}
.sumrow{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;color:var(--muted);font-size:.8rem;margin-bottom:.9rem}
.mh{font:600 .78rem/1 var(--body);color:var(--muted);margin:0 0 .5rem}
.mlist{list-style:none;margin:0 0 .9rem;padding:0;display:grid;gap:.35rem}
.mlist li{padding-left:1rem;position:relative}
.mlist li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mlist.muted li::before{background:var(--muted)}
.mfoot{display:flex;flex-wrap:wrap;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line)}
.mfoot span{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.4rem .7rem;font-size:.8rem;font-weight:500}
.mfoot span:first-child{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mfoot.txt{color:var(--muted);font-size:.78rem}
.contrib{display:grid;gap:.4rem;margin-bottom:.9rem}
.contrib div{display:grid;grid-template-columns:3rem 1fr;gap:.5rem;align-items:center}
.contrib b{color:var(--accent);font-weight:600}
.big{font:600 2.2rem/1 var(--head);margin:0 0 .8rem}
.big small{font:400 .85rem/1 var(--body);color:var(--muted);margin-left:.3rem}
.graph{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--muted);font-size:.78rem;margin-top:.5rem}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.76rem;padding:.55rem .9rem;border-bottom:1px solid var(--line)}
td{padding:.6rem .9rem;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:.45rem}
.dot.mid{background:transparent;border:1.5px solid var(--accent)}
.dot.off{background:transparent;border:1.5px solid var(--muted)}
.scroll{overflow-x:auto}

/* dark band (same in both palettes) */
.dark{--bg:#0A1426;--bg2:#0F1D36;--ink:#EEF2F8;--muted:#9AA7BA;--line:#1D2C47;--accent:#34CDB8;--accent-ink:#06201C;background:#08101F;color:var(--ink)}
.dark h2{max-width:22ch}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:1.05rem 2rem 1.05rem 0;font:600 1.05rem/1.4 var(--head);position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:.2rem;top:.95rem;font:400 1.5rem/1 var(--body);color:var(--muted)}
details[open] summary::after{content:"–"}
details[open] summary{color:var(--accent)}
details p{margin:0 0 1.25rem;color:var(--muted);max-width:42rem}

/* how */
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,3vw,2rem);margin-bottom:2.5rem}
.path{border-top:2px solid var(--ink);padding-top:1.1rem}
.path p{margin:0;color:var(--muted);font-size:.98rem}
.flow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.flow span{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.45rem .9rem;font-size:.88rem}
.flow i{color:var(--muted);font-style:normal}
#how{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* roles */
.tabs{display:flex;flex-wrap:wrap;gap:0 1.75rem;border-bottom:1px solid var(--line);margin-bottom:2.2rem}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;padding:.8rem 0;font:500 1rem/1.2 var(--body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(1.5rem,5vw,4rem);align-items:start}
.rgrid h3{font:600 1.5rem/1.25 var(--head);letter-spacing:-.02em;margin:0 0 .7rem}
.rgrid p{color:var(--muted);margin:0 0 1.25rem}
.measure{border:1px solid var(--line);border-radius:14px;padding:1.4rem;background:var(--bg2)}
.measure small{display:block;color:var(--muted);font-size:.82rem;margin-bottom:.6rem}
.measure b{font:600 1.1rem/1.4 var(--head)}

/* control */
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 2rem}
.ctl{border-top:1px solid var(--line);padding:1.2rem 0 1.4rem}
.ctl p{margin:0;color:var(--muted);font-size:.98rem}
#control{background:var(--bg2);border-top:1px solid var(--line)}

/* pilot */
.pj{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:0 0 2.5rem}
.pj span{border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:.5rem 1rem;font-size:.92rem;font-weight:500}
.pj i{color:var(--muted);font-style:normal}
.mt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 2rem}
.mt div{border-top:1px solid var(--line);padding:1rem 0 1.4rem;color:var(--ink)}

/* faq + contact */
.faq{max-width:52rem}
#contact h2{max-width:20ch}
.cgrid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(1.5rem,5vw,4rem);align-items:start}
.nexts{display:grid;gap:1.1rem;margin:2rem 0 0;padding:0;list-style:none}
.nexts li{display:grid;grid-template-columns:2rem 1fr;gap:.8rem;color:var(--muted)}
.nexts b{color:var(--ink);font-weight:600;display:block}
.nexts .n{color:var(--accent);font:600 1.1rem/1.3 var(--head)}
.chan{margin-top:1.5rem;color:var(--muted);font-size:.95rem;display:flex;flex-direction:column;gap:.3rem}
.chan a{color:var(--ink)}
#contact .fcard{background:var(--bg2)}
#contact input,#contact select,#contact textarea{background:var(--bg)}

.tight th,.tight td{padding:.6rem .5rem}.tight th:first-child,.tight td:first-child{padding-left:1rem}.tight th:last-child,.tight td:last-child{padding-right:1rem;white-space:nowrap}
.ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}
.slist{border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:3rem minmax(0,3fr) minmax(0,5fr) auto;gap:1rem 2rem;align-items:baseline;padding:1.3rem 0;border-bottom:1px solid var(--line)}
.srow h3{margin:0;font-size:1.15rem}
.srow p{margin:0;color:var(--muted);font-size:.98rem}
.sn{font:600 .9rem/1 var(--body);color:var(--accent);font-variant-numeric:tabular-nums}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1.25rem,3vw,2.5rem);margin-top:3.5rem}
.three>div{border-top:1px solid var(--line);padding-top:1.2rem}
.three .sn{display:block;margin-bottom:.8rem}
.three p{margin:0;color:var(--muted);font-size:.98rem}
@media (max-width:980px){.srow{grid-template-columns:2.2rem 1fr}.srow p{grid-column:2}.srow .tag{grid-column:2;justify-self:start}.three{grid-template-columns:1fr}}
/* documents */
.doc{padding-top:clamp(2.5rem,6vw,4.5rem);padding-bottom:clamp(3rem,7vw,5rem);max-width:780px}
.doc h1{max-width:none;font-size:clamp(2rem,4vw,3rem)}
.doc h2{font:600 1.3rem/1.3 var(--head);letter-spacing:-.01em;margin:2.5rem 0 .8rem;max-width:none}
.doc p{color:var(--muted);margin:0 0 1rem}
.doc ul{margin:0 0 1rem;padding:0;list-style:none}
.doc li{padding:.7rem 0 .7rem 1.5rem;border-top:1px solid var(--line);position:relative;color:var(--ink)}
.doc li:last-child{border-bottom:1px solid var(--line)}
.doc li::before{content:"";position:absolute;left:0;top:1.3rem;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.doc li b{font-weight:600}
.draft{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:.8rem 1rem;font-size:.92rem;color:var(--muted);margin:0 0 2rem}
.draft::before{content:"";flex:none;width:8px;height:8px;margin-top:.5rem;border-radius:50%;background:var(--accent)}
.back{display:inline-block;margin-bottom:1.5rem;color:var(--muted);text-decoration:none;font-size:.95rem}
.back:hover{color:var(--ink)}

/* footer */
footer{border-top:1px solid var(--line);padding:3rem 0 1.75rem;color:var(--muted);font-size:.92rem}
.fgrid{display:grid;grid-template-columns:minmax(0,3fr) repeat(3,minmax(0,2fr));gap:2rem;margin-bottom:2.5rem}
.fgrid h4{font:600 .78rem/1 var(--body);letter-spacing:.04em;color:var(--ink);margin:0 0 1rem}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.fgrid a{text-decoration:none}
.fgrid a:hover{color:var(--ink)}
.fbrand p{margin:.8rem 0 0;max-width:20rem}
.fbot{border-top:1px solid var(--line);padding-top:1.25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

@media (max-width:980px){
  .cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-grid,.feat,.cgrid,.rgrid{grid-template-columns:1fr}
  .feat.rev .ftext{order:0}
  .paths,.mt{grid-template-columns:1fr}
  .cards2{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  nav{display:none}
}
@media (max-width:560px){
  .cards4,.row2,.sigs{grid-template-columns:1fr 1fr}
  .cards4{grid-template-columns:1fr}
  .header-cta{display:none}
  .right{gap:.9rem}
  .fgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}body{transition:none}.stepbar i::after{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#home" aria-label="RHS Labs">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 7 L7 27 H27 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="17" cy="7" r="4.2" fill="currentColor"/><circle cx="7" cy="27" r="4.2" fill="currentColor"/><circle cx="27" cy="27" r="4.2" fill="currentColor"/></svg>
      <div>RHS <span>Labs</span></div>
    </a>
    <div class="right">
      <nav aria-label="Main"><a href="#solutions" data-t="nav_solutions"></a><a href="#how" data-t="nav_how"></a><a href="#roles" data-t="nav_roles"></a><a href="#security" data-t="nav_security"></a><a href="#faq" data-t="nav_faq"></a></nav>
      <div class="tools">
        <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="es" aria-pressed="false">ES</button></div>
        <div class="pal" role="group" aria-label="Palette preview">
          <button type="button" data-pal="dark" aria-label="Dark palette" title="Dark" style="background:linear-gradient(135deg,#0A1426 50%,#34CDB8 50%)"></button>
          <button type="button" data-pal="light" aria-label="Light palette" title="Light" style="background:linear-gradient(135deg,#F7F6F3 50%,#0F766E 50%)"></button>
        </div>
        <a class="btn sm header-cta" href="#contact" data-t="cta_demo"></a>
      </div>
    </div>
  </div>
</header>

<main>
<div id="view-home">
  <div class="hero" id="home">
    <div class="wrap hero-grid">

    $('hero-ticks').innerHTML=t.ticks.map(function(x){return '<li>'+ck()+'<span>'+esc(x)+'</span></li>'}).join('');
    $('hero-queue').innerHTML=secQueue(t);
    var mb=encodeURIComponent((lang==='es'?'Nombre: \nEmpresa: \nPaís: \n\n':'Name: \nCompany: \nCountry: \n\n'));
    $('mail-demo').href='mailto:'+CONTACT.email+'?subject='+encodeURIComponent('RHS Labs · Sentinel · '+(lang==='es'?'Demo':'Demo'))+'&body='+mb;
    $('mail-pilot').href='mailto:'+CONTACT.email+'?subject='+encodeURIComponent('RHS Labs · Sentinel · '+(lang==='es'?'Programa piloto':'Pilot program'))+'&body='+mb;
    $('sec-solutions').innerHTML=secSolutions(t);
    $('sec-a').innerHTML=secA(t);
    $('sec-ai').innerHTML=secAI(t);
    $('sec-c').innerHTML=secC(t);
    $('sec-d').innerHTML=secD(t);
    $('sec-how').innerHTML=secHow(t);
    $('sec-roles').innerHTML=secRoles(t);
    $('sec-control').innerHTML=secControl(t);
    $('sec-pilot').innerHTML=secPilot(t);
    $('sec-faq').innerHTML=secFaq(t);
    $('nexts').innerHTML=t.next.map(function(x,i){return '<li><span class="n">'+(i+1)+'</span><span><b>'+esc(x[0])+'</b>'+esc(x[1])+'</span></li>'}).join('');
    var rows=['<span>'+esc(t.chan_email)+': <a href="mailto:'+esc(CONTACT.email)+'">'+esc(CONTACT.email)+'</a></span>'];
    if(CONTACT.whatsapp)rows.push('<span>WhatsApp: <a href="https://wa.me/'+esc(CONTACT.whatsapp.replace(/\D/g,''))+'">+'+esc(CONTACT.whatsapp.replace(/\D/g,''))+'</a></span>');
    if(CONTACT.wechat)rows.push('<span>WeChat: '+esc(CONTACT.wechat)+'</span>');
    $('chan').innerHTML=rows.join('');
    $('fgrid').innerHTML='<div class="fbrand"><a class="brand" href="#home"><svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 7 L7 27 H27 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="17" cy="7" r="4.2" fill="currentColor"/><circle cx="7" cy="27" r="4.2" fill="currentColor"/><circle cx="27" cy="27" r="4.2" fill="currentColor"/></svg><div>RHS <span>Labs</span></div></a><p>'+esc(t.ft_blurb)+'</p></div>'+t.ft.map(function(c){return '<div><h4>'+esc(c[0])+'</h4><ul>'+c[1].map(function(l){return '<li><a href="'+l[1]+'">'+esc(l[0])+'</a></li>'}).join('')+'</ul></div>'}).join('');
    ['s_a','s_b','s_c'].forEach(function(k){$(k.replace('_','-')).innerHTML=t[k+'_l'].map(function(x){return '<li><b>'+esc(x[0])+'</b> '+esc(x[1])+'</li>'}).join('')});
    $('p-upd').textContent=t.p_upd;
    $('p-body').innerHTML=t.p_s.map(function(x){return '<h2>'+esc(x[0])+'</h2><p>'+esc(x[1]).replace('{email}','<a href="mailto:'+esc(CONTACT.email)+'">'+esc(CONTACT.email)+'</a>')+'</p>'}).join('');
    bindDynamic();
  }
  function bindDynamic(){
    document.querySelectorAll('[data-role]').forEach(function(b){b.addEventListener('click',function(){roleIdx=+b.getAttribute('data-role');$('sec-roles').innerHTML=secRoles(T[lang]);bindDynamic();var nb=document.querySelector('[data-role="'+roleIdx+'"]');if(nb)nb.focus()})});
  }

  /* language + palette */
  function setLang(l){lang=l;store('rhs-lang',l);render()}
  document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-lang'))})});
  var root=document.documentElement;
  function curPal(){var p=root.getAttribute('data-palette');if(p)return p;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  function markPal(){var c=curPal();document.querySelectorAll('[data-pal]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-pal')===c?'true':'false')})}
  document.querySelectorAll('[data-pal]').forEach(function(b){b.addEventListener('click',function(){var p=b.getAttribute('data-pal');root.setAttribute('data-palette',p);store('rhs-pal',p);markPal()})});
  var sp=load('rhs-pal');if(sp==='dark'||sp==='light')root.setAttribute('data-palette',sp);
  markPal();

  /* routing */
  function route(){
    var h=location.hash.replace('#','');
    var view=(h==='security'||h==='privacy')?h:'home';
    ['home','security','privacy'].forEach(function(v){$('view-'+v).hidden=(v!==view)});
    requestAnimationFrame(function(){
      if(view==='home'&&h&&h!=='home'){var e=document.getElementById(h);if(e)e.scrollIntoView()}else{window.scrollTo(0,0)}
    });
  }
  window.addEventListener('hashchange',route);

  var sl=load('rhs-lang');
  lang=(sl==='es'||sl==='en')?sl:((navigator.language||'').toLowerCase().indexOf('es')===0?'es':'en');
  render();route();
})();
</script>
</body>
